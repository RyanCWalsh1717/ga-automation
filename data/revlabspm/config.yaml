# ── Fiscal year ───────────────────────────────────────────────────────────────
fiscal_year_start_month: 1     # January

# ── Utility account routing overrides ────────────────────────────────────────
# RevLabs posts gas expense to 613120 (not the COA-default 613210).
# Adding 613120 here routes it through the same per-invoice daily-rate proration
# as electricity — one accrual line per meter/invoice (Tygen, NatGrid, NRG, etc.).
# No code changes needed to onboard other properties with different gas accounts.
metered_utility_accounts:
  - "613120"
per_invoice_utility_accounts:
  - "613120"

# ── Layer 2 Pass 2 — individual vs combined accrual mode ─────────────────────
# Accounts listed here emit one accrual JE line *per invoice* rather than
# one combined line. Use for vendors whose invoices represent distinct service
# types that reviewers need to see itemised (e.g. Casella: compactor, recycling,
# trash each get their own JE row). All other Pass 2 accounts default to combined
# mode (multiple invoices collapsed into one JE with '|' separated description).
per_invoice_accrual_accounts:
  - "610160"   # Cleaning-Trash Removal (Casella — separate lines per service type)

# ── Layer 3 exclusions ───────────────────────────────────────────────────────
# Accounts blocked from Layer 3 (historical recurring) auto-accrual.
# Use for discretionary or irregular spend that Layer 3 would mis-classify as
# a recurring contract. Layer 2 invoice proration and one-off accruals are unaffected.
layer3_exclude_accounts:
  - "637170"   # Admin-Food Service Amenities (discretionary spend, not a standing contract)

# ── Insurance policies (prepaid amortization breakdown) ───────────────────────
# Each policy gets its own JE line: DR expense_account / CR 135110.
# Both general property insurance and the umbrella policy post to 639110.
# Set the correct monthly_amount for each policy (annual premium ÷ 12).
# Leave this section absent or set monthly_amount: 0 to revert to the single
# combined budget-PTD line (old behavior).
insurance_policies:
  - name:            "Property Insurance"
    expense_account: "639110"
    monthly_amount:  4037.78
  - name:            "Umbrella Policy"
    expense_account: "639110"
    monthly_amount:  666.90
  - name:            "General Liability"
    expense_account: "639120"
    monthly_amount:  871.39
