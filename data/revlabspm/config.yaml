# ── Revolution Labs — Property Configuration ──────────────────────────────────
# data/revlabspm/config.yaml
#
# To onboard a new property:
#   1. Create data/{property_code}/ folder
#   2. Copy this file, rename to config.yaml, update every field
#   3. The property selector in the sidebar will auto-discover it
# ─────────────────────────────────────────────────────────────────────────────

# Yardi identifiers
property_system:       yardi       # yardi | mri (MRI onboarding coming soon)
property_code:         revlabspm
yardi_etl_code:        revlabpm    # ETL FinJournals PROPERTY field (max 8 chars)
property_name:         Revolution Labs Owner, LLC
property_display_name: Revolution Labs
property_address:      1050 Waltham Street, Lexington, MA
property_type:         Life Science
property_size_sf:      180000

# Capital / investment
investor_name:         Singerman Real Estate

# Management
management_company:    Greatland Realty Partners
management_code:       GRP
invoice_prefix:        RevLabsPM      # invoice numbers become RevLabsPM{MM}{YYYY}

# ── Team members ──────────────────────────────────────────────────────────────
# Names shown in the Dashboard name selector, close tracker, and sign-off sheet.
team_members:
  - Ryan Walsh
  - Natasha Parker
  - Lauren Sullivan

# ── Tenants (Utility Billing) ─────────────────────────────────────────────────
# Tenants billed back for electric/gas each month.
# key: short slug for widget IDs (no spaces, lowercase)
# name: display name shown in the TUB table
tenants:
  - key: accent
    name: Accent Therapeutics
  - key: keros_n
    name: Keros Therapeutics (N)
  - key: keros_s
    name: Keros Therapeutics (S)
  - key: orum
    name: Orum Therapeutics
  - key: santi
    name: Santi Therapeutics

# ── Default one-off accruals (Pass 1 seed table) ─────────────────────────────
# Pre-seeded rows in the One-Off Accruals table — recurring monthly items.
# Amounts are left at $0 and filled in each month. vendor is optional.
# "compound: true" means this month's JE = last month's auto-reversed amount
# + this month's entered Amount ($) -- only correct for accounts billed
# irregularly (a few times a year), where the accrued liability needs to keep
# building until a real invoice finally clears it. Confirmed with Ryan
# 2026-07-28: only Water Contract Svc (619120) is genuinely irregular here.
#
# NOTE: 617110 (HVAC), 627230 (Fire Life Safety), and 635110 (Snow & Ice) are
# NOT listed here anymore -- they're accrued automatically from the Kardin
# monthly budget by build_budget_based_accruals() (accrual_entry_generator.py,
# BUDGET_BASED_ACCOUNTS dict) instead of a manual One-Off Accruals amount:
#   - HVAC / Fire Life Safety: billing cadence varies invoice to invoice (some
#     quarterly, some monthly), so each month accrues a flat monthly baseline
#     (the account's minimum M1-M12 budget value) PLUS a separate second JE
#     line for the incremental quarterly service invoice in quarter-end months
#     (Mar/Jun/Sep/Dec) -- both suppressed if a real invoice already landed
#     via Nexus/GL that period.
#   - Snow & Ice: seasonal (Nov-Mar only), accrues the month's full Kardin
#     budget figure, and always raises a PM review flag in the Pass 1 UI each
#     active month (whether accrued from budget or already covered by a real
#     invoice) so someone confirms the amount is right.
# Do not re-add these 3 codes here -- entering them manually in the One-Off
# table would risk a duplicate JE (the UI warns if you try).
default_accruals:
  - account_code: "637150"
    account_name: Admin-Tenant Relations
    compound: false
  - account_code: "619120"
    account_name: Water Contract Svc
    compound: true           # genuinely billed irregularly -- confirmed correct as-is
  - account_code: "610140"
    account_name: Cleaning Mat/Supplies
    vendor: Durkin
    compound: false
  - account_code: "610160"
    account_name: Cleaning-Trash Removal (extra)
    vendor: Casella
    compound: false
  - account_code: "637230"
    account_name: Admin-Materials/Supplies
    vendor: BlueTriton
    compound: false

# ── Management fee structure ──────────────────────────────────────────────────
# Each entry produces one DR/CR pair in the JE and one line on the invoice.
# For a single-PM property, list only one entry (set minimum: 0).
management_fees:
  - name:       JLL
    rate:       0.0125          # 1.25%
    minimum:    5000.00         # greater of 1.25% or $5,000
    dr_account: "637130"        # Admin-Management Fees
    cr_account: "213100"        # Accrued Expenses
    ref_prefix: MGMT-FEE-JLL
  - name:       GRP
    rate:       0.0175          # 1.75%
    minimum:    0.00
    dr_account: "637130"
    cr_account: "213100"
    ref_prefix: MGMT-FEE-GRP

