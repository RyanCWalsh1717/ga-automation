# ── Property identifiers ──────────────────────────────────────────────────────
parcel_ids:
  - "00011619"
  - "R0140050002"

# ── Output file naming ────────────────────────────────────────────────────────
file_prefix_internal:     GA         # e.g. GA_Accruals_JE.csv
file_prefix_deliverable:  RevLabs    # e.g. RevLabs_Jan2026_Workpapers.xlsx

# ── Reference files (in this folder) ─────────────────────────────────────────
